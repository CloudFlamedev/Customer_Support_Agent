[project]
name = "support-triage"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=0.100.0",
    "chromadb",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "python-dotenv",
    "tenacity",
    "litellm",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]